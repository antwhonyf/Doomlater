<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doomlater | Tienda & Servicio Técnico</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel para ejecutar JSX directamente en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [vista, setVista] = useState("admin"); // "tienda" o "admin"
      const [pestañaActiva, setPestañaActiva] = useState("finanzas");

      const [cuentas, setCuentas] = useState([
        { id: 1, nombre: "Binance (USDT)", moneda: "USDT", saldo: 645.50 },
        { id: 2, nombre: "Efectivo Caja ($)", moneda: "USD", saldo: 320.00 },
        { id: 3, nombre: "Pago Móvil / Banco", moneda: "USD (Eq.)", saldo: 185.20 },
      ]);

      const [operaciones, setOperaciones] = useState([
        {
          id: 1,
          concepto: "Nintendo Switch OLED (Compra/Venta + Magia)",
          tipo: "compra_venta",
          fecha_ingreso: "2026-10-05",
          costo_compra: 190,
          inversion_taller: 25,
          detalle_inversion: "Chip RP2040 + MicroSD 128GB + Estaño/Flux",
          precio_venta: 310,
          cuenta: "Binance (USDT)",
          estado: "completado",
        },
        {
          id: 2,
          concepto: "Cambio de Puerto HDMI PS4 Pro + Mantenimiento",
          tipo: "servicio_tecnico",
          fecha_ingreso: "2026-10-10",

          inversion_taller: 6,
          detalle_inversion: "1x Puerto HDMI PS4 + Pasta térmica",
          precio_venta: 45,
          cuenta: "Pago Móvil / Banco",
          estado: "completado",
        },
        {
          id: 3,
          concepto: "Control DualSense PS5 (Con Drift)",
          tipo: "compra_venta",
          fecha_ingreso: "2026-10-14",
          costo_compra: 25,
          inversion_taller: 8,
          detalle_inversion: "Par de Joysticks Hall Effect",
          precio_venta: 60,
          cuenta: "Efectivo Caja ($)",
          estado: "en_venta",
        },
      ]);

      const [insumos, setInsumos] = useState([
        { id: 1, nombre: "Puertos HDMI PS4 / PS5", categoria: "Repuesto", stock: 2, minimo: 5, costo: 3.50 },
        { id: 2, nombre: "Flux Amtech (Jeringa 10cc)", categoria: "Insumo Taller", stock: 1, minimo: 2, costo: 8.00 },
        { id: 3, nombre: "Joysticks Hall Effect (PS5/Xbox)", categoria: "Repuesto", stock: 12, minimo: 4, costo: 4.00 },
        { id: 4, nombre: "Pasta Térmica Alta Conductividad", categoria: "Insumo Taller", stock: 4, minimo: 2, costo: 6.50 },
      ]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [vista, pestañaActiva, operaciones, insumos]);

      const operacionesCompletadas = operaciones.filter((op) => op.estado === "completado");

      const gananciaMesTotal = operacionesCompletadas.reduce(
        (acc, op) => acc + (op.precio_venta - (op.costo_compra + op.inversion_taller)),
        0
      );

      const ingresosPorServicios = operacionesCompletadas
        .filter((op) => op.tipo === "servicio_tecnico")
        .reduce((acc, op) => acc + (op.precio_venta - op.inversion_taller), 0);
